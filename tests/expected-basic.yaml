# Source: fmeflow-basic/charts/fmeflow/charts/fmeflow/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fmeflow-basic-fmeflow-engine-standard
  labels:
    helm.sh/chart: fmeflow
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: fmeflow
    app.kubernetes.io/instance: fmeflow-basic
    app.kubernetes.io/component: engine-standard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: fmeflow
      app.kubernetes.io/instance: fmeflow-basic
      app.kubernetes.io/component: engine-standard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fmeflow
        app.kubernetes.io/instance: fmeflow-basic
        app.kubernetes.io/component: engine-standard
    spec:

      serviceAccountName: default
      securityContext:
        fsGroup: 1363
      terminationGracePeriodSeconds: 300
      containers:
        - name: engine
          securityContext:
            {}
          image: "safesoftware/fmeflow-engine:2026.3.1"
          imagePullPolicy: IfNotPresent
          env:
            - name: "ENGINEDEBUGLEVEL"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "ENGINEDEBUGLEVEL"
            - name: "ENGINEPROPERTIES"
              value: standard-group
            - name: "ENGINERECEIVETIMEOUT"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "ENGINERECEIVETIMEOUT"
            - name: "ENGINETYPE"
              value: STANDARD
            - name: "EXTERNALHOSTNAME"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "EXTERNALHOSTNAME"
            - name: "EXTERNALPORT"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "EXTERNALPORT"
            - name: "NODEMANAGED"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "NODEMANAGED"
            - name: "NODENAME"
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: "PGSQLDATABASENAME"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "PGSQLDATABASENAME"
            - name: "PGSQLHOSTNAME"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "PGSQLHOSTNAME"
            - name: "PGSQLPASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "fme-database"
                  key: "password"
            - name: "PGSQLPORT"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "PGSQLPORT"
            - name: "PGSQLUSERNAME"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "PGSQLUSERNAME"
            - name: "POSTGRESQLSSL"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "POSTGRESQLSSL"
            - name: "SERVICE_CORE_NAME"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow-metadata
                  key: "SERVICE_CORE_NAME"
            - name: "SERVICE_QUEUE_NAME"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow-metadata
                  key: "SERVICE_QUEUE_NAME"
            - name: "WAITFORDATABASE"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "WAITFORDATABASE"
            - name: "WEBPROTOCOL"
              valueFrom:
                configMapKeyRef:
                  name: fmeflow-basic-fmeflow
                  key: "WEBPROTOCOL"
            - name: "COREHOSTNAME"
              value: $(SERVICE_CORE_NAME)
          terminationMessagePolicy: FallbackToLogsOnError
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/sh
                - -c
                - |
                  fmePid=$(pidof fme);
                  jobId=$(ls -lR /proc/ 2>&1 | grep -oP "job_\d+" | sed -n '1p');
                  currentJobId=$(ls -lR /proc/ 2>&1 | grep -oP "job_\d+" | sed -n '1p');
                  while ls -lR /proc/$fmePid 2>&1 | grep -q job_; do
                    while [ "$jobId" = "$currentJobId" ]
                    do
                      currentJobId=$(ls -lR /proc/ 2>&1 | grep -oP "job_\d+" | sed -n '1p');
                      sleep 1;
                    done
                    exit
                  done
          volumeMounts:
            - mountPath: /data/fmeflowdata
              name: fmeflowdata


      volumes:
        - name: fmeflowdata
          persistentVolumeClaim:
            claimName: fmeflow-basic-fmeflow-data
