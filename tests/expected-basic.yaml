        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - fmeflow
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - fmeflow-basic
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - queue
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: queue
          securityContext:
            {}
