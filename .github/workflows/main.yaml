name: Continuous integration

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

permissions:
  actions: write
  contents: write
  id-token: write
  packages: write

env:
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}

jobs:
  main:
    name: Continuous integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    strategy:
      fail-fast: true
      matrix:
        helm:
          - latest
          - 3.12.0

    steps:
      - run: docker system prune --all --force
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python3 -m pip install --requirement=ci/requirements.txt

      # Pre-commit regenerates the checked-in fixtures, so keep it on one
      # stable Helm version instead of the runner's preinstalled one, and
      # run it on a single matrix leg only.
      - name: Install helm (early, for pre-commit hooks)
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 3.21.4
        if: matrix.helm == 'latest'

      # The helm-template-gen hooks package the parent chart from file:// for
      # the examples, the parent dependencies must already be present in the
      # root charts/ directory to be embedded in the package.
      - run: helm dependency update .
        if: matrix.helm == 'latest'
      - run: helm dependency update examples/basic
        if: matrix.helm == 'latest'
      - run: helm dependency update examples/external-db-traefik
        if: matrix.helm == 'latest'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
        if: matrix.helm == 'latest'
      - run: pre-commit run --all-files --color=always
        if: matrix.helm == 'latest'
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()
      - name: Print environment information
        run: c2cciutils-env
        env:
          GITHUB_EVENT: ${{ toJson(github) }}

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - run: helm dependency update .
      - run: helm lint .
        if: matrix.helm == 'latest'

      - run: helm dependency update examples/basic
      - run: helm lint examples/basic
        if: matrix.helm == 'latest'

      - run: helm dependency update examples/external-db-traefik
      - run: helm lint examples/external-db-traefik
        if: matrix.helm == 'latest'

      # The golden files are generated and checked by the helm-template-gen
      # pre-commit hook with the pinned Helm version above, rendering them
      # again with the matrix Helm versions is not reproducible (Helm 4 does
      # not render the exact same output as Helm 3), they are applied as is
      # on k3s to validate them against the Kubernetes API.
      - name: Setup k3s/k3d
        run: c2cciutils-k8s-install

      - name: Install external-secret CRD
        run: |
          curl https://raw.githubusercontent.com/external-secrets/external-secrets/v0.16.1/deploy/crds/bundle.yaml --output /tmp/external-secrets-crd.yaml
          kubectl apply --server-side -f /tmp/external-secrets-crd.yaml

      - name: Apply
        run: kubectl apply --filename=tests/expected-basic.yaml --filename=tests/expected-external-db-traefik.yaml

      - name: Publish
        run: tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.helm == 'latest' && env.HAS_SECRETS == 'HAS_SECRETS'
      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()
