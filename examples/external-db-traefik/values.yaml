fmeflow:
  fmeflow:
    global:
      image:
        pullSecrets:
          - name: my-docker-registry

    configMaps:
      content:
        EXTERNALHOSTNAME:
          value: fme-test.example.com
        POSTGRESQLSSL:
          value: 'true'

    # The database connection and credentials come from the ExternalSecret
    # rendered by the chart, the PGSQL* environment variables of the
    # containers are automatically linked to its target Secret.
    externalSecrets:
      database:
        enabled: true
        secretStoreRef:
          kind: SecretStore
          name: my-secret-store
        data:
          hostname:
            remoteRef:
              key: pg-host
          port:
            remoteRef:
              key: pg-port
          database:
            remoteRef:
              key: fmeflow-database
          username:
            remoteRef:
              key: fmeflow-username
          password:
            remoteRef:
              key: fmeflow-password
          admin-username:
            remoteRef:
              key: fmeflow-username
          admin-password:
            remoteRef:
              key: fmeflow-password
          admin-database:
            remoteRef:
              key: fmeflow-database

    persistentVolumeClaims:
      data:
        spec:
          accessModes:
            - ReadWriteMany
          storageClassName: azurefile-csi
          resources:
            requests:
              storage: 80Gi

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.tls: 'true'
      hostGroups:
        main:
          hosts:
            - fme-test.example.com
          tls:
            enabled: true
            secretName: fme-tls

    services:
      core:
        ingress:
          enabled: true
      websocket:
        ingress:
          enabled: true

      # An extra shared volume mounted in all the components, for example a
      # Secret with the SMTP configuration:
      #
      # core:
      #   volumes:
      #     email-data:
      #       secret:
      #         secretName: fme-email
      #   containers:
      #     core:
      #       volumeMounts:
      #         /email:
      #           name: email-data
